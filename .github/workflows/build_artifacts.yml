name: Build Artifacts

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD:
        required: true
      CARGO_PACKAGER_SIGN_PRIVATE_KEY:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false


env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build artifacts for ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: hustcer/setup-nu@v3.10
        with:
          version: "0.114.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install build-essential libssl-dev pkg-config libglib2.0-dev libgtk-3-dev
      - uses: taiki-e/cache-cargo-install-action@v2 # taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Build binaries
        env:
            CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
            CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
        run: nu scripts/build_release_artifacts.nu artifacts
      - name: Upload Sentry debug symbols
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN/SENTRY_PROJECT not configured — skipping debug-files upload"
            exit 0
          fi
          npm install -g @sentry/cli
          if [ -d "target/release" ]; then
            TARGET_DIR="target/release"
          else
            echo "::warning::No release directory found — skipping"
            exit 0
          fi
          echo "Uploading debug files from $TARGET_DIR"
          sentry-cli debug-files upload --include-sources "$TARGET_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-release
          path: |
            artifacts/
            !artifacts/.*
